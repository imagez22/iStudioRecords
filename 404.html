<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - I Studio Records</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .notfound { max-width: 520px; padding: 40px 24px; }
        .notfound-code {
            font-family: var(--font-display);
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--gold-400), var(--gold-300));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }
        .notfound h1 { font-family: var(--font-display); font-size: 1.75rem; margin-bottom: 12px; }
        .notfound p { color: var(--color-text-secondary); margin-bottom: 32px; }
        .notfound-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    </style>
    <script>
        /* Redirect SPA routes for GitHub Pages */
        const path = sessionStorage.redirect;
        if (path) { delete sessionStorage.redirect; history.replaceState(null, null, path); }
    </script>
</head>
<body>
    <div class="notfound">
        <div class="notfound-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <div class="notfound-actions">
            <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
            <a href="index.html#studios" class="btn btn-outline"><i class="fas fa-microphone"></i> Browse Studios</a>
        </div>
    </div>
</body>
</html>
